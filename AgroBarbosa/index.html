<style>
:root{
  --slds-blue:#0176d3; --slds-blue-dark:#014486; --ink:#181818; --muted:#706e6b;
  --border:#c9c7c5; --bg:#f3f3f3; --card:#fff; --nav:#032d60; --success:#2e844a;
}
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit}.hidden{display:none!important}
.prototype-bar{background:#eef4ff;color:#032d60;text-align:center;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.04em;border-bottom:1px solid #d8e6fe}
.topbar{height:54px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 18px;gap:14px}
.cloud{width:38px;height:25px;background:var(--slds-blue);border-radius:18px;position:relative}
.cloud:before,.cloud:after{content:"";position:absolute;background:var(--slds-blue);border-radius:50%}
.cloud:before{width:20px;height:20px;left:5px;top:-7px}.cloud:after{width:17px;height:17px;right:4px;top:-4px}
.brand{font-weight:700;color:#032d60}.spacer{flex:1}.flow-pill{font-size:12px;background:#eef4ff;border:1px solid #aacbff;padding:6px 10px;border-radius:14px;color:#032d60}
.change{border:1px solid var(--slds-blue);color:var(--slds-blue);background:#fff;border-radius:4px;padding:7px 12px;cursor:pointer}
.appnav{background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 18px;min-height:44px;gap:4px;box-shadow:0 1px 2px #aaa}
.appnav .appname{font-weight:700;margin-right:18px}.navbtn{border:0;background:transparent;color:#fff;padding:13px 14px;cursor:pointer;border-bottom:3px solid transparent}
.navbtn.active,.navbtn:hover{background:#0b4b88;border-bottom-color:#fff}
.main{max-width:1180px;margin:0 auto;padding:26px 20px 50px}
.hero{text-align:center;padding:40px 15px 22px}.hero h1{font-size:30px;color:#032d60;margin:0 0 10px}.hero p{color:var(--muted);margin:0 auto;max-width:720px;line-height:1.5}
.flow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
.flow-card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:24px;box-shadow:0 2px 5px #00000012;display:flex;flex-direction:column;min-height:250px}
.iconbox{width:48px;height:48px;border-radius:6px;background:#eef4ff;color:#032d60;display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:18px}
.flow-card h2{font-size:20px;margin:0 0 8px;color:#032d60}.flow-card p{color:#5c5c5c;line-height:1.45;flex:1}
.primary{background:var(--slds-blue);border:1px solid var(--slds-blue);color:#fff;border-radius:4px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary:hover{background:var(--slds-blue-dark)}.secondary{background:#fff;border:1px solid var(--slds-blue);color:var(--slds-blue);border-radius:4px;padding:9px 13px;cursor:pointer}
.page-head{background:#fff;border:1px solid #ddd;border-radius:6px;padding:20px;margin-bottom:18px;display:flex;align-items:center;gap:16px}
.object-icon{width:46px;height:46px;border-radius:5px;background:#1b96ff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.eyebrow{font-size:12px;color:var(--muted);margin-bottom:3px}.page-head h1{margin:0;color:#181818;font-size:24px}.page-head .actions{margin-left:auto;display:flex;gap:8px}
.layout{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 1px 2px #0000000d;margin-bottom:18px}
.card h3{font-size:16px;margin:0;padding:15px 18px;border-bottom:1px solid #eee}.card-body{padding:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;column-gap:34px;row-gap:20px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field .value{font-size:14px;border-bottom:1px solid #eee;padding-bottom:8px;min-height:26px}
.badge{display:inline-block;border-radius:12px;padding:4px 9px;font-size:12px;background:#e8f5e9;color:#1b5e20}
.metric{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.metric:last-child{border:0}.metric strong{color:#032d60}
.note{background:#f3f8ff;border-left:4px solid var(--slds-blue);padding:12px 14px;font-size:13px;line-height:1.4}
.placeholder{padding:70px 20px;text-align:center;color:#706e6b;background:#fff;border:1px dashed #bbb;border-radius:6px}.placeholder h2{color:#032d60}

.login-page{min-height:calc(100vh - 31px);background:#f3f3f3;display:flex;flex-direction:column}
.login-brand{padding:38px 20px 22px;text-align:center}
.login-brand .cloud{margin:0 auto 14px;width:56px;height:34px;border-radius:24px}
.login-brand .cloud:before{width:28px;height:28px;top:-10px;left:8px}.login-brand .cloud:after{width:24px;height:24px;top:-7px;right:6px}
.login-brand h1{font-size:22px;color:#032d60;margin:0 0 6px}.login-brand p{margin:0;color:#706e6b;font-size:13px}
.login-card{width:min(430px,calc(100% - 32px));margin:0 auto;background:#fff;border:1px solid #ddd;border-radius:8px;padding:28px;box-shadow:0 2px 8px #00000014}
.login-field{margin-bottom:18px}.login-field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.login-field select,.login-field input{width:100%;padding:11px 12px;border:1px solid #747474;border-radius:4px;background:#fff;font:inherit}
.login-field select:focus,.login-field input:focus{outline:2px solid #1b96ff;outline-offset:1px}
.user-description{background:#f3f8ff;border:1px solid #d8e6fe;border-radius:5px;padding:12px 14px;margin:-5px 0 18px;font-size:13px;line-height:1.45;color:#3e3e3c}
.login-card .primary{width:100%}.login-help{text-align:center;color:#706e6b;font-size:12px;margin-top:16px}
.address{grid-column:1/-1}


.toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #eee;flex-wrap:wrap}
.toolbar .grow{flex:1}.search{min-width:260px;padding:8px 10px;border:1px solid #747474;border-radius:4px}
.table-wrap{overflow:auto}table.data{width:100%;border-collapse:collapse;font-size:13px}table.data th{background:#f3f3f3;text-align:left;padding:10px 12px;border-bottom:1px solid #c9c7c5;color:#3e3e3c;white-space:nowrap}table.data td{padding:11px 12px;border-bottom:1px solid #eee;white-space:nowrap}table.data a{color:#0176d3;text-decoration:none;font-weight:700;cursor:pointer}
.small-badge{display:inline-block;padding:3px 8px;border-radius:10px;background:#eef4ff;color:#032d60;font-size:11px}
.inactive{background:#f3f3f3;color:#706e6b}.tabs{display:flex;border-bottom:1px solid #ddd;background:#fff}.tab{padding:12px 16px;border:0;background:#fff;color:#3e3e3c;cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:#0176d3;border-bottom-color:#0176d3;font-weight:700}
.record-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.timeline{list-style:none;margin:0;padding:0}.timeline li{position:relative;padding:0 0 20px 26px;border-left:2px solid #d8dde6;margin-left:8px}.timeline li:last-child{border-left-color:transparent}.timeline li:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#1b96ff;left:-6px;top:3px}.timeline strong{display:block;font-size:13px}.timeline span{display:block;color:#706e6b;font-size:12px;margin:3px 0}.timeline p{font-size:13px;margin:6px 0;line-height:1.4}
.modal-backdrop{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:8px;width:min(620px,100%);box-shadow:0 8px 30px #0005}.modal-head,.modal-foot{padding:16px 20px;border-bottom:1px solid #ddd;display:flex;align-items:center}.modal-head h2{margin:0;font-size:20px}.modal-foot{border-top:1px solid #ddd;border-bottom:0;justify-content:flex-end;gap:8px}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:9px;border:1px solid #747474;border-radius:4px;font:inherit}.full{grid-column:1/-1}.closex{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:#706e6b}


.qty-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.qty-box{background:#f3f8ff;border:1px solid #d8e6fe;border-radius:5px;padding:12px}.qty-box span{display:block;font-size:11px;color:#706e6b;margin-bottom:4px}.qty-box strong{font-size:17px;color:#032d60}
.warning{background:#fff7e6;border-left:4px solid #fe9339;padding:10px 12px;margin-top:12px;font-size:12px;line-height:1.4}
.status-unavailable{background:#f3f3f3;color:#706e6b}


.filter-grid{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;align-items:end}.filter-grid label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.filter-grid select{width:100%;padding:9px;border:1px solid #747474;border-radius:4px;background:#fff}.results-meta{font-size:12px;color:#706e6b;margin-top:10px}.offer-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.offer-card{background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 1px 2px #0000000d;overflow:hidden}.offer-card-head{padding:16px 18px;border-bottom:1px solid #eee;display:flex;gap:12px}.offer-card-head .object-icon{width:38px;height:38px;font-size:12px}.offer-card-head h3{margin:0 0 4px;font-size:16px;color:#032d60}.offer-card-head p{margin:0;color:#706e6b;font-size:12px}.offer-card-body{padding:16px 18px}.offer-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.offer-card-grid span{display:block;font-size:11px;color:#706e6b;margin-bottom:3px}.offer-card-grid strong{font-size:13px}.offer-card-foot{padding:12px 18px;border-top:1px solid #eee;text-align:right}
@media(max-width:800px){.filter-grid{grid-template-columns:1fr}.offer-cards{grid-template-columns:1fr}}
@media(max-width:800px){.flow-grid,.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.appnav{overflow:auto}.topbar{padding:0 10px}.brand{font-size:13px}}
</style>
</head>
<body>
<div class="prototype-bar">PROTOTIPO FUNCIONAL · FASE 3 · DATOS DEMOSTRATIVOS</div>

<section id="selector" class="login-page">
  <div class="login-brand">
    <div class="cloud"></div>
    <h1>Gestión Productiva</h1>
    <p>Sistema de Gestión Productiva y Comercialización Agrícola</p>
  </div>
  <div class="login-card">
    <div class="login-field">
      <label for="demoUser">Nombre de usuario</label>
      <select id="demoUser" onchange="updateUserDescription()">
        <option value="">Seleccione un usuario</option>
        <option value="productor">productor.agricola@email.com</option>
        <option value="admin">administrador@email.com</option>
        <option value="comprador">comprador@email.com</option>
      </select>
    </div>
    <div id="userDescription" class="user-description hidden"></div>
    <div class="login-field">
      <label for="demoPassword">Contraseña</label>
      <input id="demoPassword" type="password" placeholder="Ingrese cualquier contraseña">
    </div>
    <button class="primary" onclick="loginDemo()">Iniciar sesión</button>
    <div class="login-help">Acceso demostrativo del prototipo. La contraseña no se valida ni se almacena.</div>
  </div>
</section>

<section id="app" class="hidden">
  <div class="topbar">
    <div class="cloud"></div><div class="brand">Gestión Productiva</div><div class="spacer"></div>
    <span id="flowLabel" class="flow-pill"></span>
    <button class="change" onclick="backToSelector()">Cambiar usuario</button>
  </div>
  <nav class="appnav">
    <span class="appname">Gestión Productiva</span>
    <div id="menu"></div>
  </nav>
  <main id="content" class="main"></main>
</section>

<script>
const menus={
  productor:["Inicio","Mi perfil","Mis cultivos","Producción","Mis ofertas"],
  admin:["Inicio","Catálogo de productos"],
  comprador:["Ofertas disponibles"]
};
const labels={productor:"Productor agrícola",admin:"Administrador",comprador:"Comprador"};
let currentFlow="";

const descriptions={
  productor:"Gestiona su perfil, cultivos, seguimiento productivo, producción y ofertas disponibles para comercialización.",
  admin:"Administra el catálogo estandarizado de productos agrícolas utilizados en los registros del sistema.",
  comprador:"Consulta las ofertas agrícolas disponibles, aplica criterios de búsqueda y accede al detalle de cada oferta."
};
function updateUserDescription(){
  const flow=document.getElementById("demoUser").value;
  const box=document.getElementById("userDescription");
  if(!flow){ box.classList.add("hidden"); box.textContent=""; return; }
  box.textContent=descriptions[flow]; box.classList.remove("hidden");
}
function loginDemo(){
  const flow=document.getElementById("demoUser").value;
  if(!flow){ alert("Seleccione un nombre de usuario para continuar."); return; }
  enterFlow(flow);
}
function enterFlow(flow){
  currentFlow=flow;
  document.getElementById("selector").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("flowLabel").textContent=labels[flow];
  const menu=document.getElementById("menu"); menu.innerHTML="";
  menus[flow].forEach((item,i)=>{
    const b=document.createElement("button");
    b.className="navbtn"+(i===0?" active":""); b.textContent=item;
    b.onclick=()=>showPage(item,b); menu.appendChild(b);
  });
  showPage(menus[flow][0],menu.firstChild);
}
function backToSelector(){
  document.getElementById("app").classList.add("hidden");
  document.getElementById("selector").classList.remove("hidden");
  document.getElementById("demoPassword").value="";
}
function showPage(page,btn){
  document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));
  if(btn) btn.classList.add("active");
  const c=document.getElementById("content");
  if(currentFlow==="productor" && page==="Inicio"){ c.innerHTML=producerHome(); return; }
  if(currentFlow==="productor" && page==="Mi perfil"){ c.innerHTML=producerProfile(); return; }
  if(currentFlow==="productor" && page==="Mis cultivos"){ c.innerHTML=cropsList(); return; }
  if(currentFlow==="productor" && page==="Producción"){ c.innerHTML=productionList(); return; }
  if(currentFlow==="productor" && page==="Mis ofertas"){ c.innerHTML=offersList(); return; }
  if(currentFlow==="admin" && page==="Inicio"){ c.innerHTML=adminHome(); return; }
  if(currentFlow==="admin" && page==="Catálogo de productos"){ c.innerHTML=productsCatalog(); return; }
  if(currentFlow==="comprador" && page==="Ofertas disponibles"){ c.innerHTML=buyerOffers(); return; }
  c.innerHTML=`<div class="placeholder"><h2>${page}</h2><p>Pantalla incluida en el flujo de ${labels[currentFlow]}. Se desarrollará en la siguiente iteración del prototipo.</p></div>`;
}

 return `
 <div class="page-head">
   <div class="object-icon">IN</div><div><div class="eyebrow">Productor agrícola</div><h1>Inicio</h1></div>
 </div>
 <div class="layout">
  <div>
   <section class="card"><h3>Resumen de mi actividad</h3><div class="card-body">
    <div class="fields">
      <div class="field"><label>Productor</label><div class="value">María López</div></div>
      <div class="field"><label>Municipio</label><div class="value">Barbosa, Antioquia</div></div>
      <div class="field"><label>Estado del perfil</label><div class="value"><span class="badge">Activo</span></div></div>
      <div class="field"><label>Última actualización</label><div class="value">Datos demostrativos</div></div>
    </div>
   </div></section>
   <section class="card"><h3>Accesos rápidos</h3><div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap">
     <button class="secondary" onclick="clickMenu('Mi perfil')">Consultar mi perfil</button>
     <button class="secondary" onclick="clickMenu('Mis cultivos')">Ver mis cultivos</button>
     <button class="secondary" onclick="clickMenu('Producción')">Consultar producción</button>

   </div></section>

  <aside>

 </div>`;
}

function productionList(){
 return `
 <div class="page-head">
   <div class="object-icon">PN</div>
   <div><div class="eyebrow">Producción</div><h1>Mi producción</h1></div>
   <div class="actions"><button class="primary" onclick="openModal('production')">Nueva producción</button></div>

 <div style="margin-bottom:12px"><button class="secondary" onclick="clickMenu('Mis ofertas')">← Mis ofertas</button></div>

function updateOfferProduction(select){
 const data={
  aguacate:{product:"Aguacate",produced:850,period:"Septiembre 2026"},
  cafe:{product:"Café",produced:420,period:"Agosto 2026"}
 };
 const d=data[select.value];
 const box=document.getElementById("offerProductionInfo");
 if(!d){ if(box) box.classList.add("hidden"); return; }
 document.getElementById("offerProduct").value=d.product;
 document.getElementById("offerProduced").textContent=d.produced+" kg";
 document.getElementById("offerPeriod").textContent=d.period;
 document.getElementById("offerQty").max=d.produced;
 document.getElementById("offerQty").value="";
 box.classList.remove("hidden");
 validateOfferQty();
}
function validateOfferQty(){
 const qty=document.getElementById("offerQty"), msg=document.getElementById("offerQtyMsg");
 if(!qty||!msg)return;
 const max=Number(qty.max||0), val=Number(qty.value||0);
 if(val>max){msg.textContent="La cantidad disponible no puede superar la cantidad producida ("+max+" kg).";msg.classList.remove("hidden");}
 else{msg.classList.add("hidden");msg.textContent="";}
}

function buyerCard(product,producer,qty,period,farm){
 return `<article class="offer-card" data-product="${product}" data-producer="${producer}" data-period="${period}"><div class="offer-card-head"><div class="object-icon">OF</div><div><h3>${product}</h3><p>Oferta disponible</p></div></div><div class="offer-card-body"><div class="offer-card-grid"><div><span>Productor</span><strong>${producer}</strong></div><div><span>Cantidad disponible</span><strong>${qty} kg</strong></div><div><span>Período de cosecha</span><strong>${period}</strong></div><div><span>Ubicación</span><strong>Barbosa, Antioquia</strong></div></div></div><div class="offer-card-foot"><button class="primary" onclick="buyerOfferDetail('${product}','${producer}','${farm}','${qty}','${period}')">Ver detalle</button></div></article>`;
}
function applyBuyerFilters(){
 const p=document.getElementById("buyerProduct").value,r=document.getElementById("buyerProducer").value,h=document.getElementById("buyerPeriod").value;let n=0;
 document.querySelectorAll("#buyerOfferCards .offer-card").forEach(c=>{const show=(!p||c.dataset.product===p)&&(!r||c.dataset.producer===r)&&(!h||c.dataset.period===h);c.style.display=show?"":"none";if(show)n++;});
 document.getElementById("buyerResultCount").textContent=n+" oferta"+(n===1?"":"s")+" disponible"+(n===1?"":"s");
}
function clearBuyerFilters(){["buyerProduct","buyerProducer","buyerPeriod"].forEach(id=>document.getElementById(id).value="");applyBuyerFilters();}

}

function filterRows(input,id){
 const q=input.value.toLowerCase();
 document.querySelectorAll("#"+id+" tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none");
}
function toggleProduct(btn){
 const row=btn.closest("tr"), cell=row.children[3];
 const inactive=btn.textContent==="Activar";
 cell.innerHTML=inactive?'<span class="badge">Activo</span>':'<span class="small-badge inactive">Inactivo</span>';
 btn.textContent=inactive?"Desactivar":"Activar";
}

   <div><label>Estado</label><select><option>Activo</option><option>Inactivo</option></select></div>
  </div>`;}

 if(type==="production" || type==="productionEdit"){
  title=type==="production"?"Nueva producción":"Editar producción";

  <div class="form-grid">
   <div><label>Cultivo</label><select onchange="syncProductionProduct(this)"><option value="">Seleccione un cultivo</option><option value="Aguacate">Cultivo de aguacate</option><option value="Café">Cultivo de café</option></select></div>
   <div><label>Producto</label><input id="productionProduct" value="${type==="productionEdit"?"Aguacate":""}" placeholder="Se completa según el cultivo" readonly></div>

 if(type==="offer" || type==="offerEdit"){

    <div><label>Estado</label><select><option>Disponible</option><option>No disponible</option></select></div>
  </div>
  <div id="offerProductionInfo" class="hidden">
    <div class="qty-summary">
      <div class="qty-box"><span>Cantidad producida</span><strong id="offerProduced">0 kg</strong></div>
      <div class="qty-box"><span>Período de cosecha</span><strong id="offerPeriod" style="font-size:14px">-</strong></div>
      <div class="qty-box"><span>Producto</span><strong style="font-size:14px">Según producción</strong></div>
    </div>
  </div>

  <div class="note" style="margin-top:16px">La oferta queda vinculada a una producción registrada. La cantidad ofertada debe ser menor o igual a la cantidad producida.</div>`;}

 const wrap=document.createElement("div");wrap.id="modal";wrap.className="modal-backdrop";
 wrap.innerHTML=`<div class="modal"><div class="modal-head"><h2>${title}</h2><button class="closex" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="closeModal()">Guardar</button></div></div>`;
 document.body.appendChild(wrap);
}
function syncProductionProduct(select){
 const field=document.getElementById("productionProduct");
 if(field) field.value=select.value;
}
function closeModal(){const m=document.getElementById("modal");if(m)m.remove();}

function clickMenu(label){
